<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="static/css/main.css">
    <title>{% block title %}Hollow Knight{% endblock %}</title>
</head>
<body>
    <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom"> 
        <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-decoration-none header-title"> 
            <img src="{{ url_for('static', filename='image/icon.png')}}" width="80" class="me-2" alt="Логотип">
            <span class="header-title">Hollow Knight - сложность пантеонов</span> </a> 
        <ul class="nav nav-pills"> 
            <li class="nav-item"><a href="/" class="nav-link {% if request.path == '/' %}active{% endif%}" aria-current="page">Главная</a></li>
            <li class="nav-item"><a href="/comparison" class="nav-link {% if request.path == '/comparison' %}active{% endif%}">Сравнение</a></li> 
            <li class="nav-item"><a href="/about" class="nav-link {% if request.path == '/about' %}active{% endif%}">О проекте</a></li> 
        </ul> 
    </header>
    <main class="mt-5">
        {% block content %}
        {% endblock%}
    </main>
    
    <nav class="navigation-links">
        {% if request.path != '/' %}
            <a href="{{ url_for('index') }}">Назад</a>
        {% endif %}
        <a href="#top">Наверх</a>
    </nav>
    
    <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top"> 
        <span class="mb-3 mb-md-0 text-ligth">© 2025 Company, Inc</span> 
        
        <ul class="nav col-md-4 justify-content-end list-unstyled d-flex"> 
            <li class="ms-3">
                <a class="text-ligth" href="https://t.me/SkrizZz_Evil" target="_blank" aria-label="Telegram">
                    <img src="{{ url_for('static', filename='image/telegram.svg') }}" width="24" height="24" alt="Telegram">
                </a>
            </li> 
            <li class="ms-3">
                <a class="text-light" href="https://steamcommunity.com/id/skrizzzevil/" aria-label="Steam">
                    <img src="{{ url_for('static', filename='image/steam.svg') }}" width="24" height="24" alt="Steam">
                </a>
            </li> 
        </ul> 
    </footer>
</body>
</html>
